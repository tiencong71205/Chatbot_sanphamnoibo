name: vhomenex-rag-v2

# NOTE: Qdrant is already running as a separate container on the host.
# Backend connects to it via host.docker.internal:6333
# Do NOT start a new Qdrant container here to avoid conflicts.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: vhomenex-backend:v2
    container_name: vhomenex-backend-v2
    restart: unless-stopped
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./ui:/app/ui
      - ./data:/app/data
      - ./storage:/app/storage
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: vhomenex-frontend:v2
    container_name: vhomenex-frontend-v2
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./ui:/app/ui
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
    name: vhomenex-rag-v2-network
