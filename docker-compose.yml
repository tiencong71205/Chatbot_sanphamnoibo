name: vhomenex-rag-v2

# NOTE: Qdrant is already running as a separate container on the host.
# Backend connects to it via host.docker.internal:6333
# Do NOT start a new Qdrant container here to avoid conflicts.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: vhomenex-backend:v2
    container_name: vhomenex-backend-v2
    restart: unless-stopped
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./ui:/app/ui
      - ./data:/app/data
      - ./storage:/app/storage
      - ./logs:/app/logs
    ports:
      # Chỉ mở cho chính máy chủ (127.0.0.1), KHÔNG mở ra mạng.
      # Lý do: Docker ghi luật iptables ở tầng thấp hơn và chèn TRƯỚC
      # luật của ufw, nên `ufw deny 8000` gần như không có tác dụng với
      # cổng do Docker mở — đã kiểm chứng thực tế: máy khác trong mạng
      # vẫn truy cập được dù ufw đã chặn. Giới hạn ngay ở đây là cách
      # duy nhất chắc chắn. Nginx chạy trên máy chủ vẫn gọi được bình
      # thường, và các script kiểm thử chạy trên máy chủ cũng vậy.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: vhomenex-frontend:v2
    container_name: vhomenex-frontend-v2
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./ui:/app/ui
      # Bắt buộc: Streamlit đọc theme từ .streamlit/config.toml ở thư mục
      # làm việc. Thiếu dòng này, file cấu hình màu nằm ngoài container và
      # KHÔNG có tác dụng gì — Streamlit chạy theme mặc định, tự đổi
      # sáng/tối theo cài đặt trình duyệt của từng người dùng.
      - ./.streamlit:/app/.streamlit
    ports:
      # Chỉ mở cho chính máy chủ — người dùng vào qua nginx (cổng 80).
      # Xem giải thích ở phần ports của backend phía trên.
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


networks:
  default:
    name: vhomenex-rag-v2-network
