# Nginx reverse proxy cho Vhomenex AI Assistant
#
# Nhiệm vụ:
#   1. Cho phép truy cập bằng tên miền thay vì IP:cổng
#   2. CHỈ cho phép truy cập từ dải mạng RD và HO — mọi nơi khác bị chặn
#   3. Che cổng 8501 (Streamlit) khỏi bị gọi trực tiếp
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║  CẦN ĐIỀN TRƯỚC KHI DÙNG: 3 chỗ đánh dấu  # >>> SỬA <<<          ║
# ╚══════════════════════════════════════════════════════════════════╝

# --- Danh sách dải mạng được phép truy cập ---------------------------
# Cách lấy dải mạng: trên 1 máy bất kỳ trong mạng RD (hoặc HO), chạy
#   Windows: ipconfig       -> xem IPv4 Address + Subnet Mask
#   Linux/Mac: ip addr      -> xem dòng "inet 10.x.x.x/24"
# Rồi điền dạng CIDR, ví dụ 10.10.20.0/24 nghĩa là mọi máy 10.10.20.*
geo $allowed_network {
    default 0;

    # Cho phép TOÀN BỘ dải mạng nội bộ (RFC1918) — mọi mạng trong công ty
    # (Wi-Fi RD, Wi-Fi HO, mạng dây, và bất kỳ mạng nào thêm sau này).
    #
    # Vì sao không liệt kê từng dải riêng: đã kiểm chứng thực tế có thiết
    # bị NAT giữa các mạng — nginx nhìn thấy MỌI máy từ mạng khác đều
    # mang cùng một IP nguồn (192.168.1.5), không phải IP thật của máy.
    # Nên liệt kê từng dải chỉ tạo cảm giác an toàn giả: máy ở dải chưa
    # khai báo vẫn vào được (đã gặp với 192.168.2.54), còn mỗi lần công ty
    # thêm mạng mới lại phải sửa file này và khởi động lại nginx.
    #
    # Tác dụng thật vẫn giữ nguyên: chặn truy cập từ ngoài Internet hoặc
    # mạng lạ không đi qua hạ tầng nội bộ.
    192.168.0.0/16   1;
    10.0.0.0/8       1;
    172.16.0.0/12    1;   # gồm cả dải nội bộ của Docker

    # Máy chủ tự gọi chính nó (health check, script kiểm thử)
    127.0.0.1/32     1;
}

# Streamlit dùng WebSocket để cập nhật giao diện theo thời gian thực.
# Thiếu 2 dòng map này, giao diện sẽ tải được nhưng KHÔNG phản hồi khi
# gõ câu hỏi -- lỗi rất dễ tưởng nhầm là backend hỏng.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # >>> SỬA <<<  Tên miền CHÍNH — địa chỉ hiển thị trên thanh trình duyệt
    server_name tracuu.vconnex.vn;

    # Không giới hạn kích thước tệp tải lên quá chặt (ảnh đính kèm).
    client_max_body_size 25M;

    location / {
        # Chặn ở đây, KHÔNG đặt ở cấp server: một khối `if` cấp server áp
        # dụng cho mọi request, kể cả chính trang /403.html bên dưới — khi
        # đó trang báo lỗi tự chặn chính nó, nginx rơi vào vòng lặp và trả
        # về trang 403 mặc định xấu xí thay vì trang tuỳ chỉnh.
        if ($allowed_network = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Bắt buộc cho WebSocket của Streamlit
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Câu trả lời của chatbot có thể mất tới ~60s ở tải cao (đã đo
        # thực tế: P95 khoảng 17s ở 10 người dùng đồng thời, nhưng câu
        # tổng hợp nhiều nguồn có thể lâu hơn). Mặc định nginx là 60s --
        # đặt 300s để không cắt ngang câu trả lời đang stream.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        # Streaming token-by-token: phải tắt buffer, nếu không người dùng
        # sẽ thấy màn hình đứng im rồi hiện ra cả đoạn một lúc.
        proxy_buffering off;
    }

    # Trang báo lỗi thân thiện khi bị chặn vì sai mạng.
    # `error_page 403 /403.html` giữ nguyên mã trạng thái 403 gửi về trình
    # duyệt; bên trong location phải `return 200` (không phải 403) — trả 403
    # ở đây sẽ bị nginx hiểu là một lỗi MỚI, kích hoạt lại error_page thành
    # vòng lặp, và kết quả là trình duyệt nhận trang 403 mặc định xấu xí
    # của nginx thay vì trang này.
    error_page 403 /403.html;
    location = /403.html {
        internal;
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8">
<title>Không có quyền truy cập</title>
<style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
background:#F8FAFC;color:#1F242D;display:flex;align-items:center;
justify-content:center;height:100vh;margin:0}
.box{max-width:460px;text-align:center;padding:2rem;background:#fff;
border:1px solid #E2E8F0;border-radius:12px}
h1{font-size:1.25rem;margin:0 0 .6rem}
p{color:#64748B;font-size:.92rem;line-height:1.6;margin:0}</style></head>
<body><div class="box"><h1>Không có quyền truy cập</h1>
<p>Hệ thống chỉ hoạt động trong mạng nội bộ Vconnex (RD hoặc HO).<br>
Vui lòng kết nối mạng công ty hoặc VPN rồi thử lại.</p></div></body></html>';
    }
}

# ─────────────────────────────────────────────────────────────────────
# Tên miền phụ: gõ vào sẽ tự chuyển sang tên miền chính ở trên.
#
# Mục đích: ai quen gõ kiểu nào cũng vào được, nhưng cuối cùng mọi người
# đều thấy chung MỘT địa chỉ trên thanh trình duyệt — tránh tình trạng
# 3 tên miền cùng hiện, người dùng không biết cái nào là "thật".
#
# Muốn cả 3 tên miền đều hiện nguyên (không chuyển hướng)? Xoá nguyên
# khối server này, và thêm 2 tên miền phụ vào dòng server_name của khối
# chính ở trên, cách nhau bởi dấu cách:
#     server_name tracuu.vconnex.vn chat.vconnex.vn ai.vconnex.vn;
# ─────────────────────────────────────────────────────────────────────
server {
    listen 80;

    # >>> SỬA <<<  Các tên miền phụ
    server_name chat.vconnex.vn ai.vconnex.vn;

    # 301 = chuyển hướng vĩnh viễn, trình duyệt sẽ nhớ và tự đi thẳng
    # tới tên miền chính ở những lần sau.
    # >>> SỬA <<<  Đổi cho khớp tên miền chính phía trên
    return 301 http://tracuu.vconnex.vn$request_uri;
}
